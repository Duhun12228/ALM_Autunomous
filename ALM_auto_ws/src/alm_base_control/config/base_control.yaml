# ============================================================================
# cmd_arbiter: 자율/텔레옵 동작권 중재. 여기 출력(mux)이 command_manager 입력이 된다.
# 동작권 전환:  ros2 service call /cmd_arbiter/set_owner
#                 alm_msgs/srv/SetControlOwner "{owner: teleop}"   (auto | teleop)
# 파라미터는 런타임 변경 가능: ros2 param set /cmd_arbiter teleop_timeout_sec 1.0
# ============================================================================
cmd_arbiter:
  ros__parameters:
    # 입력(소스) 토픽
    cmd_vel_nav_topic: /cmd_vel            # Nav2(DWB) 출력
    drive_mode_nav_topic: /drive_mode      # 수동/webui 가 설정하는 자율 모드
    cmd_vel_teleop_topic: /cmd_vel_teleop  # keyboard_teleop 출력
    drive_mode_teleop_topic: /drive_mode_teleop
    # 출력 토픽 (command_manager 입력과 반드시 일치)
    cmd_vel_out_topic: /cmd_vel_mux
    drive_mode_out_topic: /drive_mode_mux
    owner_topic: /cmd_arbiter/owner        # 현재 소유자 (latched, 관측용)
    # 동작
    default_owner: "auto"                  # 부팅 시 소유자 (자율)
    publish_rate_hz: 50.0
    nav_timeout_sec: 0.5                   # Nav2 가 이 시간 끊기면 0 twist
    teleop_timeout_sec: 0.5               # 텔레옵 끊기면 정지 유지(HELD)

command_manager:
  ros__parameters:
    # ---- 토픽 ----
    cmd_vel_topic: /cmd_vel_mux         # cmd_arbiter 출력 (자율/텔레옵 중재 결과)
    drive_mode_topic: /drive_mode_mux   # cmd_arbiter 출력 모드
    estop_topic: /emergency_stop       # std_msgs/Bool
    command_topic: /mcu/command        # alm_msgs/McuCommand (MCU 전송용)
    mcu_state_topic: /mcu/state        # alm_msgs/McuState (MCU fault 감시)
    # 워치독 대상. 주행 모드에선 EKF 를 끄므로 /odometry/filtered 가 없어
    # 워치독이 조용히 비활성된다 -> FAST-LIO 출력을 본다.
    odom_topic: /Odometry              # nav_msgs/Odometry (워치독)

    # ---- 동작 ----
    publish_rate_hz: 50.0
    default_drive_mode: "auto"
    enable_motors_on_start: true
    cmd_timeout_sec: 0.5               # 이 시간 넘게 cmd_vel 없으면 정지

    # ---- E-STOP 래치 ----
    # /emergency_stop 은 "세워라"만 뜻한다. true 는 받고 false 는 무시하며,
    # 해제는 /emergency_stop/release (alm_msgs/srv/ReleaseEstop) 로만 가능하다.
    # 토픽으로 풀 수 있으면 래치가 아니다 — 노드 하나가 실수로 false 를 주기적
    # 발행하면 정지가 조용히 풀린다. 웹 UI 도 래치를 전제로 만들어져 있다.
    estop_latch: true
    # 해제 시 MCU 가 아직 fault/estop 을 보고 중이면 거부한다.
    # 소프트웨어가 물리 상태를 앞질러 '해제됨'을 표시하지 않기 위함.
    estop_release_requires_clear_mcu: true

    # ---- 속도/가속 제한 (안전 게이팅). ##TODO## 실제 플랫폼 사양으로 조정 ----
    max_linear_x: 0.45
    min_linear_x: -0.15
    max_linear_y: 0.30                 # crab 모드 측면 속도 한계
    max_angular_z: 0.8
    # (9) Nav2 velocity_smoother 가 이미 가속 제한을 하므로 여기 rate_limit 은
    #     mode 전환/e-stop 해제 시점의 안전 램프 역할. 이중 제한이 굼뜨면 false 로.
    enable_rate_limit: true
    max_accel_x: 1.0                   # m/s^2 (rate limit)
    max_accel_y: 1.0
    max_accel_theta: 1.5              # rad/s^2

    # ---- 추가 안전 (7) MCU fault 반영, (8) 오도메트리 워치독 ----
    stop_on_mcu_fault: true           # /mcu/state 에 fault/estop 오면 정지
    odom_watchdog_sec: 0.5            # 주행 중 odom 이 이 시간 끊기면 정지 (0=비활성)

    # ---- auto 모드 선택 로직 (참고 레포 selectAutoDriveMode 포팅) ----
    auto_crab_enabled: false          # localization 안정성 위해 기본 비활성
    auto_spin_angular_threshold: 0.35
    auto_spin_release_angular_threshold: 0.03
    auto_spin_linear_threshold: 0.04
    auto_spin_exit_linear_threshold: 0.10
    auto_spin_max_angular_speed: 0.45
    auto_spin_entry_duration_sec: 0.20
    auto_spin_exit_duration_sec: 0.40
    auto_mode_min_hold_sec: 0.80
    auto_crab_lateral_threshold: 0.05
    auto_crab_angular_threshold: 0.10

    # ---- 4WIS 변환 (twist -> steer_deg/speed_rpm/mode) ----
    # 아래 5개는 STM32 CONS 벡터와 반드시 같은 값이어야 합니다.
    # 값 출처: STM32 Simulink 모델 ALM07.slx 의 CONS 생성 서브시스템.
    #   wheelbase_m         <- CONS(2) B = 1000 mm
    #   track_m             <- CONS(3) T = 919 mm   (전체 윤거, 코드가 /2 함)
    #   rws_ratio           <- CONS(1) 후륜 보조조향률 = 50%
    #   crab_rpm_scale      <- CONS(10) = 0.5
    #   zero_turn_rpm_scale <- CONS(11) = 0.6
    wheelbase_m: 1.0                  # ALM07.slx CONS(2)
    track_m: 0.919                    # ALM07.slx CONS(3)
    rws_ratio: 0.5                    # ALM07.slx CONS(1) — 후륜이 전륜의 50% 역방향
    crab_rpm_scale: 0.5               # ALM07.slx CONS(10)
    zero_turn_rpm_scale: 0.6          # ALM07.slx CONS(11)

    # ##CONFIRM## 실차 사양 실측 후 확정할 값 (Simulink CONS 에 없음)
    wheel_radius_m: 0.103             # ##CONFIRM## 접지 상태 실효 반지름. rpm 환산에 직접 영향
    gear_ratio: 1.0                   # ##CONFIRM## 모터 rpm / 휠 rpm. STM32 rpm 명령 단위 확인 필요
    max_steer_deg: 30.0               # ##CONFIRM## 일반 주행 내측 전륜 기구 한계.
                                      #   크랩 90°(CONS(8)) / 제로턴 47°(CONS(9)) 는
                                      #   STM32 고정 자세이므로 여기 넣으면 안 됨.
    max_rpm: 3000.0                   # ##CONFIRM## 구동 드라이버 한계
    straight_angle_deg: 2.0           # ##CONFIRM## CONS(4) 데드밴드.
                                      #   ALM07.slx 의 '직진판정각도(DEG)' Constant 블록에서 실제 값 확인 필요
    # 크랩/제로턴 방향 부호. 실차에서 저속으로 방향 확인 후 뒤집을 것 (+1 / -1)
    #   +linear.y  -> 좌측 크랩 이동?      아니면 crab_steer_sign: -1.0
    #   +angular.z -> 반시계 제자리 회전?  아니면 spin_steer_sign: -1.0
    crab_steer_sign: 1.0              # ##CONFIRM##
    spin_steer_sign: 1.0              # ##CONFIRM##
