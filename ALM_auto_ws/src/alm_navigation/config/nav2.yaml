# Nav2 파라미터 - 흐름도 '④ Nav2·경로계획'
#
#   planner_server   : SmacPlannerHybrid (Hybrid-A*, Reeds-Shepp)  -> /plan
#   smoother_server  : ConstrainedSmoother (Ceres 곡률/장애물 제약) -> /plan 마감
#   controller_server: MPPIController (샘플링 MPC)                 -> /cmd_vel
#
#   파이프라인 연결은 behavior_trees/navigate_*_w_smoothing.xml 이 담당합니다
#   (ComputePathToPose -> SmoothPath -> FollowPath). BT xml 절대경로는
#   navigation.launch.py 의 RewrittenYaml 이 아래 default_nav_*_bt_xml 에 주입합니다.
#
#   실차: use_sim_time=false, base_frame=base_link
#
# ============================================================================
# ★ 이 파일의 숫자는 전부 이 워크스페이스의 실제 상수에서 유도했습니다.
#   출처 1: alm_base_control/config/base_control.yaml  (= STM32 ALM07.slx CONS)
#   출처 2: alm_description/urdf/alm_robot.urdf.xacro  (= CAD 실측 지오메트리)
#   유도 로직: alm_base_control/scripts/fourwis_encode.py
#
#   재계산·정합검사:
#     ros2 run alm_navigation nav2_kinematic_check.py
#   base_control.yaml 의 기구 상수를 바꾸면 이 스크립트가 어긋난 항목을 알려줍니다.
# ============================================================================
#
# ---- 기구 상수 (base_control.yaml) ----
#   wheelbase B = 1.000 m (CONS(2)) · track T = 0.919 m (CONS(3))
#   rws_ratio = 0.5 (CONS(1), 후륜이 전륜의 50% 역조향) · max_steer = 30° (내측 전륜)
#
# ---- 파생: 선회 한계 (fourwis_encode.min_turn_radius) ----
#   최소 선회반경 R_min      = 1.643 m
#   normal 모드 최대 요레이트 = 0.274 rad/s  @ vx=0.45   (= vx / R_min)
#   ⚠ 후륜 역조향(rws=0.5)이 반영된 값입니다. 후륜 고정(rws=0)으로 계산하면
#     2.079 m 가 나오는데, 그건 이 플랫폼의 실제 기구가 아닙니다.
#
#   조향각별 선회반경:  10°→4.25 m   20°→2.31 m   25°→1.91 m   30°→1.643 m
#
# ---- 파생: footprint (URDF 실측) ----
#   앞바퀴 최전방 x = front_x 0.6106 + wheel_r 0.103 = 0.7136
#   뒤끝        x = min(rear_x -0.3010 - 0.103, -body_length/2) = -0.600
#   최대 |y|      = max(half_track 0.500 + wheel_w/2 0.0244, body_width/2 0.4936) = 0.5244
#   → 여유 포함 채택: x[-0.65, +0.72], y[±0.53]
#      inscribed radius = 0.530 m · circumscribed radius = 0.894 m
#      ##중요## inflation_radius 는 반드시 circumscribed(0.894) 보다 커야
#      costmap 기반 충돌평가와 MPPI CostCritic 의 임계값이 성립합니다.
#
# ============================================================================
# ★ 왜 Hybrid-A* 인가 (SmacPlanner2D 대신)
#
#   이 플랫폼은 normal 모드에서 '자동차형'입니다 — R_min 1.643 m 아래로는 못 돕니다.
#   SmacPlanner2D 는 로봇을 점으로 보고 격자 위를 A* 하므로 90° 꺾인 경로를
#   태연히 냅니다. 그 경로를 스무더가 사후에 펴야 하는데, 스무더는 형상을
#   '완화'할 뿐 실현가능성을 '보장'하지 못합니다. 즉 계획과 실행이 어긋납니다.
#
#   Hybrid-A* 는 R_min 을 만족하는 모션 프리미티브만으로 탐색하므로
#   나오는 경로가 처음부터 실현가능합니다. 부수 효과가 셋 더 있습니다:
#     ① 경로의 모든 pose 에 유효한 자세(yaw)가 있다
#        → MPPI PathAlignCritic.use_path_orientations=true 를 켤 수 있어
#          추종 품질이 크게 올라갑니다 (2D 경로에선 yaw 가 전부 0이라 못 켭니다).
#     ② 목표 자세(RViz 에서 찍은 화살표 방향)를 지킵니다.
#        SmacPlanner2D 는 목표 yaw 를 버리고 '마지막 진행방향'으로 대체합니다.
#     ③ 스무더가 '구제'가 아니라 '마감' 역할이 되어 실패해도 안전합니다.
#
#   대가: 탐색 상태공간이 (x, y, yaw) 로 늘어 CPU 를 더 씁니다. 아래
#   downsample_costmap / angle_quantization_bins 가 그 조절 손잡이입니다.
#
#   ▸ 실제 맵(alm_lab 50.7 x 33.6 m)에서 타당성 확인:
#       로봇 중심이 놓일 수 있는 영역   1429.7 m2 (84.1%) — 99.9% 가 단일 연결성분
#       R_min 선회 가능 영역            1079.5 m2 (63.5%)
#       U턴 가능 영역 (R_min+inscribed) 956.9 m2 (56.3%)
#     주행가능 영역이 하나로 이어져 있어 Hybrid-A* 가 위상적으로 막힐 일은 없습니다.
#     다만 '제자리에서 방향을 바꿀 수 있는' 영역은 7조각으로 나뉘므로,
#     좁은 곳에서 돌아설 수 있게 Reeds-Shepp(후진 허용)을 씁니다.
# ============================================================================

amcl:
  # FAST-LIO-Localization 을 쓰므로 이 스택에서는 기동하지 않습니다.
  # (lifecycle_manager 목록에 없음) 설정만 남겨둡니다.
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_link"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 40.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 180
    max_particles: 2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    # normal/spin 주행은 차동 모델에 가까움. crab 을 상시 쓰면 OmniMotionModel 로 변경.
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.1
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /Odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # ↓ navigation.launch.py(RewrittenYaml)가 alm_navigation/behavior_trees/*.xml
    #   절대경로로 덮어씁니다. 키가 존재해야 치환되므로 지우지 마세요.
    default_nav_to_pose_bt_xml: "OVERRIDDEN_BY_LAUNCH"
    default_nav_through_poses_bt_xml: "OVERRIDDEN_BY_LAUNCH"
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      # ↓ 커스텀 BT 의 SmoothPath 노드에 필요 (빠지면 BT 파싱 실패)
      - nav2_smooth_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /Odometry
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      # R_min 이 커서 목표 근처 자세 정렬에 시간이 걸린다. 너무 짧으면
      # 정렬 중에 '진척 없음'으로 오판한다.
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.20
      # Hybrid-A* 는 목표 자세를 지키므로 2D 시절처럼 넉넉히 열어둘 필요가 없다.
      # 최종 자세 정렬은 command_manager 의 auto 모드가 spin 으로 처리한다
      # (normal 모드는 제자리 회전을 못 하므로 이 tolerance 를 너무 조이면
      #  spin 진입/이탈이 반복될 수 있다 — 0.20 rad ≈ 11.5°).
      yaw_goal_tolerance: 0.20

    # ---------------- MPPI (샘플링 기반 MPC) ----------------
    # 지평선 = time_steps * model_dt = 56 * 0.05 = 2.80 s
    #   vx=0.45 기준 예측거리 1.26 m (차체 길이 1.37 m 와 비슷한 수준)
    # model_dt 는 1/controller_frequency(=0.05) 와 맞춥니다.
    # ##TODO## Orin Nano 에서 controller_server CPU 가 포화되면
    #          batch_size 1600 -> 1000, time_steps 56 -> 40 순으로 낮추세요.
    #          코너에서 안쪽으로 파고들면 반대로 time_steps 를 올리세요.
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 1600
      iteration_count: 1

      # ---- 왜 DiffDrive 인가 (Ackermann 이 아니라) ----
      # 이 플랫폼은 4륜 독립조향이라 spin 모드에서 제자리 회전이 됩니다.
      # MPPI 를 Ackermann(min_turning_r=1.643)으로 묶으면 제자리 회전을 아예
      # 계획하지 못해, 출발 시 자세 정렬과 목표 자세 맞춤을 전부 Nav2 Spin
      # 리커버리에 떠넘기게 됩니다.
      # 경로의 R_min 준수는 이미 Hybrid-A* 가 보장하므로 MPPI 는 자유롭게 둡니다.
      # normal 모드로 못 내는 곡률은 command_manager 가 |wz| <= |vx|/R_min 으로
      # 접고(steer_limit_enabled), 진짜 제자리 회전 요청(vx≈0, wz 큼)은 auto 모드가
      # spin 으로 보냅니다 (auto_spin_angular_threshold, base_control.yaml).
      # → normal 모드의 30° 보장은 command_manager 가 최종 책임집니다.
      #   설계 근거 → docs/nav2_planning.md §3
      motion_model: "DiffDrive"

      # 전진 = +x. vy 는 crab 전용이라 Nav2 경로에서는 쓰지 않습니다
      # (command_manager 가 crab 모드로 별도 처리).
      vx_max: 0.45          # base_control.yaml max_linear_x
      vx_min: -0.15         # base_control.yaml min_linear_x
      vy_max: 0.0
      # spin 모드 상한(auto_spin_max_angular_speed 0.45)에 맞춥니다.
      # normal 모드에서 실제로 낼 수 있는 값은 vx/R_min = 0.274 @vx=0.45 이며,
      # 그 사이 구간은 command_manager 가 조향각 한계로 클램프합니다.
      wz_max: 0.45

      # 탐색 노이즈 표준편차 (제어 범위의 1/3 정도가 무난)
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.20

      temperature: 0.3
      gamma: 0.015
      # 경로에서 앞쪽으로 이 거리까지만 보고 평가. 지평선 예측거리(1.26 m)보다
      # 넉넉해야 코너를 미리 봅니다.
      prune_distance: 2.0
      transform_tolerance: 0.3
      # 제어가 이 시간 이상 끊기면 제어 시퀀스를 초기화
      reset_period: 1.0
      regenerate_noises: false
      visualize: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      # DiffDrive 에선 미사용이나 플러그인이 파라미터를 선언하므로 남겨둡니다.
      # 값은 혼동 방지를 위해 실제 R_min 을 넣어둡니다.
      AckermannConstraints:
        min_turning_r: 1.643

      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      # CostCritic: 차체가 1.37 x 1.06 m 로 원형근사와 차이가 커서
      #             consider_footprint=true (실제 footprint 충돌검사)로 둡니다.
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.5
        trajectory_point_step: 2

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        # ★ Hybrid-A* 전환의 실질 이득. 경로의 모든 pose 에 유효한 yaw 가 있어
        #   자세까지 정렬하며 따라갑니다. SmacPlanner2D 경로에서는 yaw 가 전부
        #   0 이라 반드시 false 여야 했습니다.
        use_path_orientations: true

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.0

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        max_angle_to_furthest: 1.0
        threshold_to_consider: 0.5
        # Reeds-Shepp 경로에는 후진 구간이 섞일 수 있습니다. true 로 두면
        # 그 구간을 '역방향'으로 보고 페널티를 줘 추종이 무너집니다.
        # 전진 선호는 아래 PreferForwardCritic 이 담당합니다.
        forward_preference: false

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        # 후진 속도가 전진의 1/3(0.15 vs 0.45)이라 후진은 실제로 비쌉니다.
        # Hybrid-A* 의 reverse_penalty 와 방향을 맞춥니다.
        cost_weight: 5.0
        threshold_to_consider: 0.5

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      # MPPI 롤아웃(prune_distance 2.0 m + footprint 반경 0.894 m)이 전부
      # 들어가야 하므로 DWB 시절의 5x5 에서 8x8 로 확대 (0.05 m → 160x160 셀).
      width: 8
      height: 8
      resolution: 0.05
      # URDF 실측 유도값 (파일 상단 참고). inscribed 0.530 / circumscribed 0.894
      footprint: "[[0.72, 0.53], [0.72, -0.53], [-0.65, -0.53], [-0.65, 0.53]]"
      always_send_full_costmap: True
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_max_range: 20.0
          obstacle_min_range: 0.2
          raytrace_max_range: 25.0
          raytrace_min_range: 0.2
          max_obstacle_height: 2.0
        pointcloud:
          # 자기가림 마스크가 이미 파서 단계에서 적재물을 제거한 점군입니다
          # (alm_sensors/livox_udp_pointcloud2.py 의 mask_*).
          topic: /livox/lidar
          data_type: "PointCloud2"
          clearing: True
          marking: True
          obstacle_max_range: 15.0
          obstacle_min_range: 0.3
          raytrace_max_range: 18.0
          raytrace_min_range: 0.3
          min_obstacle_height: 0.10
          max_obstacle_height: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # circumscribed radius(0.894 m) 보다 커야 MPPI CostCritic 의
        # findCircumscribedCost() 가 올바른 임계값을 얻습니다.
        cost_scaling_factor: 3.0
        inflation_radius: 1.00

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      footprint: "[[0.72, 0.53], [0.72, -0.53], [-0.65, -0.53], [-0.65, 0.53]]"
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: True
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan pointcloud
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: True
          marking: True
          obstacle_max_range: 20.0
          obstacle_min_range: 0.2
          raytrace_max_range: 25.0
          raytrace_min_range: 0.2
          max_obstacle_height: 2.0
        pointcloud:
          topic: /livox/lidar
          data_type: "PointCloud2"
          clearing: True
          marking: True
          obstacle_max_range: 15.0
          obstacle_min_range: 0.3
          raytrace_max_range: 18.0
          raytrace_min_range: 0.3
          min_obstacle_height: 0.10
          max_obstacle_height: 1.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Hybrid-A* 는 SE2 footprint 로 실제 충돌검사를 하므로 팽창은 '금지선'이
        # 아니라 '벽에서 떨어져 달리려는 선호도'로 작동합니다(cost_penalty 와 짝).
        # 완만한 기울기(낮은 scaling_factor)여야 탐색이 중앙선을 타므로
        # 2D 시절(3.0/0.55)보다 넓고 완만하게 둡니다.
        # 맵 자유공간의 중앙값 여유가 2.75 m 라 1.20 m 팽창은 통로를 막지 않습니다.
        cost_scaling_factor: 2.0
        inflation_radius: 1.20

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65

# ---------------- SmacPlannerHybrid (Hybrid-A*) ----------------
# 상태공간 (x, y, yaw) 위에서 R_min 을 만족하는 모션 프리미티브만 이어붙여
# 탐색하므로, 나오는 경로가 처음부터 실현가능합니다. 선택 근거는 파일 상단 참고.
planner_server:
  ros__parameters:
    use_sim_time: false
    # BT 의 RateController 가 1 Hz 로 재계획하므로 기대 주기도 1 Hz
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.50            # 목표에 정확히 못 붙을 때 허용 반경 (m)
      allow_unknown: true        # 미탐사 영역 통과 허용 (track_unknown_space 와 세트)
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      # 1 Hz 재계획이므로 이 안에 끝나야 합니다. 넘으면 tolerance 내 최선해 반환.
      max_planning_time: 2.0

      # ---- 탐색 격자 ----
      # 각도 72 bin = 5.0°. R_min 에서 5° 회전 = 호길이 0.143 m = costmap 2.9셀
      # 이라 격자 해상도(0.05 m)와 균형이 맞습니다.
      angle_quantization_bins: 72
      # ##TODO## Orin Nano 에서 계획시간이 2 s 를 넘기면 여기부터 손대세요:
      #   downsample_costmap: true + downsampling_factor: 2  (0.05 → 0.10 m)
      #   맵 자유공간 84.1% 가 여유 0.53 m 이상이라 통로가 막히지 않습니다.
      downsample_costmap: false
      downsampling_factor: 1
      # 장애물 휴리스틱 캐시. 전역 costmap 에 동적 obstacle_layer 가 붙어 있어
      # 캐시가 낡으면 탐색이 엉뚱하게 퍼집니다. 성능이 급하면 true 로.
      cache_obstacle_heuristic: false
      # Reeds-Shepp 거리 휴리스틱을 미리 구워두는 창 크기 [m].
      # 내부 격자 = lookup_table_size / costmap_resolution 이고, 여기에
      # angle_quantization_bins(72)를 곱한 만큼을 기동 시 한 번 계산한다.
      # ★ 이 값은 '기동 지연'에 직결된다 (실측, 이 개발 PC 기준):
      #     20.0 (400셀) -> planner configure 8.19 s
      #     10.0 (200셀) -> planner configure 2.40 s   ← 채택
      #   Orin Nano 에서는 이보다 몇 배 더 걸린다. R_min 이 1.643 m 라
      #   10 m 창이면 선회반경 6개분 — analytic_expansion(3.5 m)과 지역
      #   휴리스틱에 충분하고, 그보다 먼 거리는 어차피 장애물 휴리스틱이
      #   지배한다. 창 밖 거리도 즉석 계산으로 정확히 나온다(느릴 뿐).
      lookup_table_size: 10.0

      # ---- 운동학 ----
      # ★ 이 한 줄이 Hybrid-A* 의 핵심. fourwis_encode.min_turn_radius() 값과
      #   반드시 같아야 합니다 (nav2_kinematic_check.py 가 검사).
      #   후륜 50% 역조향(CONS(1)=0.5) 포함 30° 조향 시 R = 1.643 m.
      minimum_turning_radius: 1.643
      # REEDS_SHEPP = 전진+후진. DUBIN 은 전진 전용.
      # R_min 선회 가능 영역이 7조각으로 나뉘어 있어(파일 상단 타당성 분석),
      # 전진만으로는 좁은 곳에서 돌아설 수 없습니다. 후진을 허용하되
      # 아래 reverse_penalty 로 비싸게 매겨 평소엔 전진 경로가 나오게 합니다.
      motion_model_for_search: "REEDS_SHEPP"
      # 후진 1 m 의 비용배수. 실제 속도비(0.45 / 0.15 = 3.0)를 그대로 씁니다 —
      # 후진은 3배 느리므로 3배 비싼 게 맞습니다.
      reverse_penalty: 3.0
      change_penalty: 0.0        # 조향방향 전환 페널티 (Hybrid 에선 0 권장)
      non_straight_penalty: 1.20 # 직진이 아닌 프리미티브 페널티
      # 장애물 비용 가중치. ↑ 이면 벽에서 더 떨어져 돌아갑니다.
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      # ---- 해석적 확장 (목표 근처에서 Reeds-Shepp 곡선으로 직접 연결) ----
      analytic_expansion_ratio: 3.5
      # Nav2 권장 = 2 * R_min = 3.29 → 3.5.
      # 너무 길게 잡으면 장애물을 스치는 곡선으로 목표에 붙습니다.
      analytic_expansion_max_length: 3.5

      # 내장 경량 스무더: 프리미티브 이음매와 각도 양자화 자국 제거.
      # 곡률/장애물 제약 평활화는 아래 smoother_server 가 담당합니다.
      smooth_path: true

# ---------------- ConstrainedSmoother (Ceres) ----------------
# BT 의 SmoothPath 노드가 ComputePathToPose 결과를 여기로 보내 마감합니다.
# 곡률(w_curve) · 원경로 이탈(w_dist) · 매끄러움(w_smooth) · 장애물비용(w_cost)의
# 가중합을 Ceres 로 최소화합니다.
#
# Hybrid-A* 경로는 이미 실현가능하므로 여기서는 '구제'가 아니라 '마감'입니다.
# 그래서 SmacPlanner2D 를 쓸 때보다 원경로를 존중하는 설정이 맞습니다.
smoother_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: "global_costmap/costmap_raw"
    footprint_topic: "global_costmap/published_footprint"
    robot_base_frame: base_link
    transform_tolerance: 0.3
    smoother_plugins: ["SmoothPath"]
    SmoothPath:
      plugin: "nav2_constrained_smoother/ConstrainedSmoother"
      # Hybrid-A*(REEDS_SHEPP) 경로에는 방향전환점(cusp)이 있을 수 있습니다.
      # true 여야 스무더가 cusp 를 인식해 그 지점의 자세를 보존합니다.
      reversing_enabled: true
      # ★ 2D 플래너를 쓸 때와 정반대. Hybrid-A* 의 시작/목표 자세는 각각
      #   로봇의 실제 현재 헤딩과 사용자가 지정한 목표 자세라 '진짜'입니다.
      #   그대로 고정해야 평활화가 시작 자세를 틀어놓지 않습니다.
      keep_start_orientation: true
      keep_goal_orientation: true
      path_downsampling_factor: 3   # 3점마다 최적화 (속도)
      path_upsampling_factor: 1     # 결과를 베지어로 되살릴 배수
      # ★ Hybrid-A* 의 minimum_turning_radius 와 같은 값이어야 합니다.
      #   다르면 스무더가 플래너의 결정을 되돌립니다.
      minimum_turning_radius: 1.643
      # ⚠ w_curve 는 R_min 위반 페널티인데, nav2 기본값 30 은 w_smooth(15000)
      #   대비 500배 작아 사실상 무시됩니다. 원경로가 이미 R_min 을 지키므로
      #   Hybrid-A* 에서는 '망가뜨리지 않게 붙잡는' 역할입니다.
      #   ##TODO## 실차에서 경로가 여전히 급하면 ↑, 과하게 넓게 돌면 ↓.
      w_curve: 200.0
      # 2D 플래너 때와 달리 원경로가 신뢰할 만하므로 이탈을 조금 억제합니다
      # (0 = 원경로 추종 강제 안 함).
      w_dist: 5.0
      w_smooth: 15000.0
      w_cost: 0.020      # ↑ 이면 장애물에서 더 멀어지려 함
      w_cost_cusp_multiplier: 3.0
      cusp_zone_length: 2.5
      # base_link 원점 외에 추가로 costmap 비용을 볼 점 [x, y, weight] 묶음.
      # 차체가 길어(전 +0.72 / 후 -0.65) 앞뒤 끝을 함께 봅니다.
      cost_check_points: [0.55, 0.0, 1.0, -0.45, 0.0, 1.0]
      optimizer:
        max_iterations: 70
        debug_optimizer: false
        gradient_tol: 5.0e-3
        fn_tol: 1.0e-6
        param_tol: 1.0e-15
        linear_solver_type: "SPARSE_NORMAL_CHOLESKY"

behavior_server:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    # spin 모드 상한(base_control.yaml auto_spin_max_angular_speed)과 맞춥니다.
    # 여기만 크게 두면 velocity_smoother 와 command_manager 가 이중으로 깎습니다.
    max_rotational_vel: 0.45
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    # ★ normal 모드 조향각은 wz/vx 비(=선회반경)로만 결정됩니다. 가속제한이
    #   성분별로 따로 걸리면 램프 구간에서 비가 망가져 조향각이 튑니다
    #   (wz 는 1.5 rad/s² 로 vx 의 1.0 m/s² 보다 먼저 목표에 도달).
    #   true = 가장 제한적인 성분에 맞춰 나머지도 같이 스케일 → vx:wz 비 유지.
    #   command_manager 의 조향 클램프가 최종 보장하지만, 여기서 맞춰두면
    #   클램프가 개입할 일 자체가 줄어듭니다.
    scale_velocities: True
    feedback: "OPEN_LOOP"
    # [vx, vy, wz]. wz 는 MPPI wz_max / spin 상한과 동일하게 0.45.
    max_velocity: [0.45, 0.0, 0.45]
    min_velocity: [-0.15, 0.0, -0.45]
    max_accel: [1.0, 0.0, 1.5]
    max_decel: [-1.5, 0.0, -1.5]
    odom_topic: "/Odometry"
    odom_duration: 0.1

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: True
    node_names: ["map_server"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: True
    # ##중요## smoother_server 가 빠지면 BT 의 SmoothPath 가 서버를 못 찾아
    #          매 계획마다 Fallback 으로 떨어집니다(주행은 되지만 평활화 없음).
    node_names: ["controller_server", "smoother_server", "planner_server",
                 "behavior_server", "bt_navigator", "waypoint_follower",
                 "velocity_smoother"]
